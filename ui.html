<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* For Webkit-based browsers (Chrome, Safari) */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: #f1f5f9;
            /* slate-100 */
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #94a3b8;
            /* slate-400 */
            border-radius: 3px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #64748b;
            /* slate-500 */
        }

        /* Blinking cursor effect */
        .blinking-cursor {
            display: inline-block;
            width: 8px;
            height: 1.2rem;
            background-color: #4f46e5;
            /* indigo-600 */
            animation: blink 1s step-end infinite;
            margin-left: 2px;
        }

        @keyframes blink {

            from,
            to {
                background-color: transparent;
            }

            50% {
                background-color: #4f46e5;
                /* indigo-600 */
            }
        }

        /* Basic markdown styling */
        .chat-messages .markdown-content p:last-child {
            margin-bottom: 0;
        }

        .chat-messages .markdown-content h1,
        .chat-messages .markdown-content h2,
        .chat-messages .markdown-content h3 {
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .chat-messages .markdown-content ul,
        .chat-messages .markdown-content ol {
            padding-left: 1.5rem;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .chat-messages .markdown-content code {
            background-color: #e2e8f0;
            padding: 0.1rem 0.3rem;
            border-radius: 0.25rem;
            font-size: 0.9em;
        }

        .chat-messages .markdown-content pre {
            background-color: #f1f5f9;
            padding: 0.75rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
        }
    </style>
</head>

<body class="bg-slate-100 flex items-center justify-center h-screen">

    <div id="chat-container"
        class="w-full max-w-2xl h-[90vh] flex flex-col bg-white rounded-2xl shadow-2xl overflow-hidden">

        <!-- Header -->
        <header
            class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white p-4 flex items-center justify-between shadow-md z-10">
            <div class="flex items-center space-x-3">
                <img src="https://placehold.co/40x40/ffffff/a78bfa/png?text=A" alt="Avatar"
                    class="w-10 h-10 rounded-full border-2 border-indigo-200">
                <div>
                    <h1 class="text-lg font-bold">Coach On Tap Chatbot</h1>
                    <p class="text-sm text-indigo-200">Online</p>
                </div>
            </div>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="text-white h-6 w-6">
                <circle cx="12" cy="12" r="1"></circle>
                <circle cx="19" cy="12" r="1"></circle>
                <circle cx="5" cy="12" r="1"></circle>
            </svg>
        </header>

        <!-- Messages Area -->
        <main id="chat-messages" class="flex-1 p-6 overflow-y-auto chat-messages space-y-4">
            <!-- Messages will be dynamically added here -->
        </main>

        <!-- Input Area -->
        <footer class="p-4 bg-slate-50 border-t border-slate-200">
            <form id="chat-form" class="flex items-center space-x-3">
                <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off"
                    class="flex-1 p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none transition duration-200">
                <button type="submit"
                    class="p-3 bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-full hover:from-purple-700 hover:to-indigo-700 transition-transform transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="h-6 w-6">
                        <path d="m22 2-7 20-4-9-9-4Z" />
                        <path d="M22 2 11 13" />
                    </svg>
                </button>
            </form>
        </footer>
    </div>

    <script>
        const chatMessages = document.getElementById('chat-messages');
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');

        // This will hold the conversation history, including streamed responses
        let history = [
            { role: "assistant", content: "hi how can help you ?" },
            { role: "user", content: "My name is Kendrick" },
            { role: "assistant", content: "hi Man how can help you ?" },
        ];

        /**
         * Appends a message to the chat UI.
         * @param {string} role - 'user' or 'assistant'.
         * @param {string} content - The message text.
         * @returns {HTMLElement} The created message element.
         */
        const addMessageToUI = (role, content) => {
            const messageWrapper = document.createElement('div');
            const messageElement = document.createElement('div');
            const contentContainer = document.createElement('div');

            messageWrapper.classList.add('flex', 'items-end', 'space-x-2');
            messageElement.classList.add('px-4', 'py-2', 'rounded-2xl', 'max-w-md', 'break-words');

            if (role === 'user') {
                messageWrapper.classList.add('justify-end');
                messageElement.classList.add('bg-indigo-600', 'text-white', 'rounded-br-lg');
            } else {
                messageWrapper.classList.add('justify-start');
                messageElement.classList.add('bg-slate-200', 'text-slate-800', 'rounded-bl-lg');

                // Add avatar for assistant
                const avatar = document.createElement('img');
                avatar.src = "https://placehold.co/32x32/a78bfa/ffffff/png?text=A";
                avatar.alt = "Avatar";
                avatar.classList.add("w-8", "h-8", "rounded-full");
                messageWrapper.appendChild(avatar);
            }

            contentContainer.innerHTML = content; // Using innerHTML to render potential formatting
            messageElement.appendChild(contentContainer);
            messageWrapper.appendChild(messageElement);
            chatMessages.appendChild(messageWrapper);

            // Scroll to the bottom
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return contentContainer; // Return the container for direct manipulation
        };

        /**
         * Connects to the backend and streams the chat response.
         * @param {string} query - The user's query.
         * @param {Array} history - The conversation history.
         * @param {Function} onToken - Callback function for each token received.
         * @param {Function} onComplete - Callback function when the stream is finished.
         */
        async function streamChatWithAccumulation(query, history, onToken, onComplete) {
            const url = "http://localhost:8000/chat?sse=true"; // Note: This might cause CORS issues if the server isn't configured correctly.

            const payload = {
                query: query,
                history: history
            };

            const headers = {
                "Accept": "text/event-stream",
                "Content-Type": "application/json",
            };

            let fullResponse = '';

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(payload),
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const reader = response.body?.getReader();
                if (!reader) {
                    throw new Error('Failed to get response reader');
                }

                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();

                    if (done) {
                        onComplete(fullResponse);
                        break;
                    }

                    // Decode the chunk directly as a token, since there's no "data:" or "[DONE]"
                    const token = decoder.decode(value, { stream: true });
                    fullResponse += token;
                    onToken(token);
                }
            } catch (error) {
                console.error('Streaming Error:', error);
                const errorMessage = `Sorry, something went wrong. (Error: ${error.message})`;
                // Use the callbacks to display the error in the UI
                onToken(errorMessage);
                onComplete(errorMessage);
            }
        }


        /**
         * Handles the form submission to send a message.
         * @param {Event} e - The form submission event.
         */
        const handleFormSubmit = async (e) => {
            e.preventDefault();
            const query = messageInput.value.trim();
            if (!query) return;

            // 1. Add user message to UI and history
            history.push({ role: 'user', content: query });
            addMessageToUI('user', query);
            messageInput.value = '';

            // 2. Create a placeholder for the assistant's streaming response
            const assistantMessageContainer = addMessageToUI('assistant', '<span class="blinking-cursor"></span>');
            assistantMessageContainer.parentElement.classList.add('markdown-content');

            let fullResponse = '';

            // Call the actual streaming function instead of the mock
            await streamChatWithAccumulation(
                query,
                history.slice(0, -1), // Pass history *before* the user's latest query
                // onToken callback
                (token) => {
                    fullResponse += token;
                    // Update the UI by replacing the content, but keeping the cursor at the end
                    // Use textContent to prevent accidental HTML injection during streaming
                    const tempCursor = '<span class="blinking-cursor"></span>';
                    assistantMessageContainer.textContent = fullResponse;
                    assistantMessageContainer.insertAdjacentHTML('beforeend', tempCursor);
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                },
                // onComplete callback
                (finalResponse) => {
                    // Remove the cursor and finalize the message by parsing markdown
                    assistantMessageContainer.innerHTML = marked.parse(finalResponse);
                    // 3. Add the complete assistant response to history for future context
                    // Avoid adding error messages to the official history
                    if (!finalResponse.startsWith('Sorry, something went wrong.')) {
                        // Store the raw markdown content in history
                        history.push({ role: 'assistant', content: finalResponse });
                    }
                }
            );
        };

        // Attach event listener
        chatForm.addEventListener('submit', handleFormSubmit);

        // Initial load of chat history
        history.forEach(message => addMessageToUI(message.role, message.content));

    </script>
</body>

</html>
